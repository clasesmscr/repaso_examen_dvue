<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plataforma de estudio (nivel práctica) para el examen de Diseño de Vestuario, Utilería y Escenografía.">
<title>Tras Bambalinas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<style>
/* Layout: escenario (hero con telón y marquesina) + tablero de estudio por unidades; navegación fija abajo en móvil, pestañas arriba en escritorio */
:root{
  --bg:#F5F3F8; --surface:#FFFFFF; --surface-2:#EDE9F3; --ink:#1D1A26; --muted:#4A4558; --line:#CFC8DB;
  --accent:#4A27B0; --accent-ink:#FFFFFF; --accent-soft:#E7E1FA;
  --vest:#A8124A; --vest-soft:#FBE3EC; --esc:#0A6680; --esc-soft:#DCF0F6; --uti:#8A5200; --uti-soft:#FAEAD1;
  --ok:#1B6E34; --ok-soft:#DDF3E3; --bad:#A82A20; --bad-soft:#FBE1DE;
  --stage:#2A1440; --stage-2:#43205F; --stage-ink:#F7F1FB; --stage-muted:#DCCDE8; --curtain:#8C1238; --curtain-2:#5E0B25; --bulb:#F4C152;
  --focus:#1F5BFF; --bw:1.5px;
  --font-display:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16141C; --surface:#211E29; --surface-2:#2B2735; --ink:#E8E4EF; --muted:#BDB6CB; --line:#4A4359;
    --accent:#B4A3FF; --accent-ink:#17131F; --accent-soft:#30284A;
    --vest:#FF8AB3; --vest-soft:#3B1A28; --esc:#72CFE8; --esc-soft:#13303A; --uti:#F2BE5E; --uti-soft:#3A2C12;
    --ok:#7BD69A; --ok-soft:#173222; --bad:#FF958C; --bad-soft:#3D1B19;
    --stage:#1E1029; --stage-2:#33194A; --stage-ink:#F1EAF6; --stage-muted:#D2C3DF; --curtain:#7A1030; --curtain-2:#4A0A1E; --bulb:#E6B64C;
    --focus:#9CC0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16141C; --surface:#211E29; --surface-2:#2B2735; --ink:#E8E4EF; --muted:#BDB6CB; --line:#4A4359;
  --accent:#B4A3FF; --accent-ink:#17131F; --accent-soft:#30284A;
  --vest:#FF8AB3; --vest-soft:#3B1A28; --esc:#72CFE8; --esc-soft:#13303A; --uti:#F2BE5E; --uti-soft:#3A2C12;
  --ok:#7BD69A; --ok-soft:#173222; --bad:#FF958C; --bad-soft:#3D1B19;
  --stage:#1E1029; --stage-2:#33194A; --stage-ink:#F1EAF6; --stage-muted:#D2C3DF; --curtain:#7A1030; --curtain-2:#4A0A1E; --bulb:#E6B64C;
  --focus:#9CC0FF; color-scheme:dark;
}
:root[data-contrast="alto"]{ --muted:var(--ink); --line:var(--ink); --bw:2.5px; }
:root{ font-size:112.5%; }
html,body{ background:var(--bg); color:var(--ink); }
body{ font-family:var(--font-body); font-size:1rem; line-height:1.6; -webkit-font-smoothing:antialiased; }
:root[data-spacing="amplio"] body{ letter-spacing:.035em; word-spacing:.12em; line-height:1.85; }
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none!important; }
h1,h2,h3{ font-family:var(--font-display); line-height:1.15; text-wrap:balance; margin:0; letter-spacing:-.01em; }
p{ margin:0; }
button,input,textarea{ font:inherit; color:inherit; }
a{ color:var(--accent); }
:focus-visible{ outline:3px solid var(--focus); outline-offset:3px; border-radius:6px; }
.sr-only{ position:absolute!important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.wrap{ max-width:1000px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }

/* ---------- barra superior ---------- */
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--surface); }
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--surface); border-bottom:var(--bw) solid var(--line); }
.topbar .wrap{ display:flex; align-items:center; gap:12px; padding-block:10px; }
.brand{ display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); min-width:0; }
.brand svg{ color:var(--vest); flex:none; }
[tabindex="-1"]:focus{ outline:none; }
.brand b{ font-family:var(--font-display); font-weight:800; font-size:1.15rem; white-space:nowrap; }
.lvl{ display:inline-block; vertical-align:middle; margin-left:6px; font-size:.7rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:999px; background:var(--uti-soft); color:var(--uti); border:var(--bw) solid var(--uti); white-space:nowrap; }
.hero .lvl{ margin:0 0 0 0; background:var(--bulb); color:#2A1440; border-color:var(--bulb); font-size:.78rem; }
.brand small{ display:block; font-size:.72rem; color:var(--muted); font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
.top-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; }
.save{ display:flex; align-items:center; gap:6px; font-size:.8rem; color:var(--muted); }
.save.is-bad{ color:var(--bad); font-weight:700; }
.iconbtn{ min-width:48px; min-height:48px; padding:0 12px; display:inline-flex; align-items:center; justify-content:center; gap:6px; border:var(--bw) solid var(--line); background:var(--surface); border-radius:12px; cursor:pointer; font-weight:700; }
.iconbtn:hover{ background:var(--surface-2); }
.iconbtn[aria-expanded="true"]{ background:var(--accent-soft); border-color:var(--accent); }

/* ---------- navegación ---------- */
.tabs{ background:var(--bg); }
.tabs ul{ list-style:none; margin:0; padding:12px 0 0; display:flex; gap:8px; }
.tabs a{ display:flex; align-items:center; gap:8px; min-height:48px; padding:0 16px; border-radius:999px; text-decoration:none; color:var(--muted); font-weight:700; border:var(--bw) solid transparent; }
.tabs a:hover{ color:var(--ink); background:var(--surface-2); }
.tabs a[aria-current="page"]{ background:var(--ink); color:var(--bg); }
@media (max-width:720px){
  .tabs{ position:fixed; left:0; right:0; bottom:0; z-index:25; background:var(--surface); border-top:var(--bw) solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
  .tabs .wrap{ padding:0; }
  .tabs ul{ padding:6px 4px; gap:2px; justify-content:space-around; }
  .tabs li{ flex:1; }
  .tabs a{ flex-direction:column; gap:2px; padding:6px 2px; border-radius:12px; font-size:.72rem; min-height:56px; justify-content:center; }
  .tabs a[aria-current="page"]{ background:var(--accent-soft); color:var(--ink); }
  main#view{ padding-bottom:calc(96px + env(safe-area-inset-bottom,0px)); }
  .save span{ display:none; }
  .brand small{ display:none; }
}
main{ padding-block:20px 48px; outline:none; }

/* ---------- elementos comunes ---------- */
.stack{ display:flex; flex-direction:column; gap:20px; }
.row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.eyebrow{ font-size:.78rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.lead{ color:var(--muted); max-width:62ch; }
.panel{ background:var(--surface); border:var(--bw) solid var(--line); border-radius:var(--r); padding:20px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:48px; padding:10px 20px; border-radius:12px; border:var(--bw) solid var(--line); background:var(--surface); color:var(--ink); font-weight:700; cursor:pointer; text-decoration:none; text-align:center; }
.btn:hover{ background:var(--surface-2); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.btn.primary:hover{ filter:brightness(1.08); }
.btn.ok{ background:var(--ok); border-color:var(--ok); color:var(--surface); }
.btn.ghost{ background:transparent; border-color:transparent; color:var(--muted); }
.btn.ghost:hover{ color:var(--ink); background:var(--surface-2); }
.btn[disabled]{ opacity:.55; cursor:not-allowed; }
.btn.big{ min-height:56px; font-size:1.05rem; padding:12px 24px; }
.chip{ display:inline-flex; align-items:center; gap:6px; font-size:.82rem; font-weight:700; padding:4px 10px; border-radius:999px; background:var(--surface-2); color:var(--ink); }
.chip.v{ background:var(--vest-soft); color:var(--vest); } .chip.e{ background:var(--esc-soft); color:var(--esc); } .chip.u{ background:var(--uti-soft); color:var(--uti); }
.bar{ height:10px; border-radius:999px; background:var(--surface-2); overflow:hidden; border:var(--bw) solid var(--line); }
.bar > i{ display:block; height:100%; background:var(--accent); border-radius:999px; transition:width .4s ease; }
.bar.v > i{ background:var(--vest); } .bar.e > i{ background:var(--esc); } .bar.u > i{ background:var(--uti); }
.num{ font-variant-numeric:tabular-nums; }
.back{ align-self:flex-start; }
h1.view-title{ font-size:clamp(1.6rem, 4vw, 2.2rem); font-weight:800; }
h2.sec{ font-size:1.35rem; font-weight:800; }

/* ---------- hero / escenario ---------- */
.hero{ position:relative; overflow:hidden; border-radius:22px; background:radial-gradient(120% 90% at 50% 0%, var(--stage-2), var(--stage) 70%); color:var(--stage-ink); padding:40px 56px 32px; }
.hero::before,.hero::after{ content:""; position:absolute; top:0; bottom:0; width:36px; background:repeating-linear-gradient(90deg, var(--curtain) 0 9px, var(--curtain-2) 9px 12px, var(--curtain) 12px 18px); }
.hero::before{ left:0; border-bottom-right-radius:28px; }
.hero::after{ right:0; border-bottom-left-radius:28px; }
.bulbs{ position:absolute; top:12px; left:48px; right:48px; height:10px; background:radial-gradient(circle, var(--bulb) 0 3.5px, transparent 4px) 0 0/24px 10px repeat-x; animation:glow 2.6s ease-in-out infinite alternate; }
@keyframes glow{ from{ opacity:.65 } to{ opacity:1 } }
.hero .eyebrow{ color:var(--stage-muted); }
.hero h1{ font-size:clamp(1.7rem, 4.6vw, 2.6rem); font-weight:800; margin-top:8px; max-width:20ch; }
.hero p.lead{ color:var(--stage-muted); margin-top:10px; }
.hero-stats{ display:flex; flex-wrap:wrap; gap:12px; margin-top:22px; }
.hstat{ background:rgba(255,255,255,.1); border:1.5px solid rgba(255,255,255,.22); border-radius:14px; padding:10px 14px; min-width:150px; flex:1 1 150px; }
.hstat .k{ font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--stage-muted); }
.hstat .v{ font-family:var(--font-display); font-weight:800; font-size:1.35rem; display:flex; align-items:center; gap:6px; }
.hstat .bar{ background:rgba(255,255,255,.18); border-color:transparent; margin-top:6px; }
.hstat .bar > i{ background:var(--bulb); }
.hero-actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:22px; }
.hero .btn{ border-color:rgba(255,255,255,.35); background:transparent; color:var(--stage-ink); }
.hero .btn:hover{ background:rgba(255,255,255,.1); }
.hero .btn.primary{ background:var(--bulb); border-color:var(--bulb); color:#2A1440; }
@media (max-width:600px){ .hero{ padding:36px 30px 24px; } .hero::before,.hero::after{ width:16px; } .bulbs{ left:24px; right:24px; } }

/* ---------- unidades ---------- */
.units{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:16px; }
@media (max-width:900px){ .units{ grid-template-columns:1fr; } }
.unit{ background:var(--surface); border:var(--bw) solid var(--line); border-radius:var(--r); overflow:hidden; display:flex; flex-direction:column; }
.unit-head{ padding:16px 18px; display:flex; gap:12px; align-items:center; }
.unit.v .unit-head{ background:var(--vest-soft); color:var(--vest); }
.unit.e .unit-head{ background:var(--esc-soft); color:var(--esc); }
.unit.u .unit-head{ background:var(--uti-soft); color:var(--uti); }
.unit-head h3{ font-size:1.15rem; color:var(--ink); }
.unit-head .eyebrow{ color:inherit; }
.unit-head .pct{ margin-left:auto; font-family:var(--font-display); font-weight:800; font-size:1.3rem; }
.topics{ list-style:none; margin:0; padding:6px 18px 16px; display:flex; flex-direction:column; }
.topic-row{ padding:12px 0; border-bottom:var(--bw) solid var(--line); display:flex; flex-direction:column; gap:8px; }
.topic-row:last-child{ border-bottom:0; }
.topic-row .tname{ font-weight:700; display:flex; justify-content:space-between; gap:8px; }
.topic-row .tname span{ color:var(--muted); font-weight:400; font-size:.88rem; white-space:nowrap; }
.topic-row .row .btn{ min-height:44px; padding:6px 14px; font-size:.92rem; flex:1; }

/* ---------- tarjetas de selección ---------- */
.grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap:14px; }
.pick{ text-align:left; display:flex; flex-direction:column; gap:8px; padding:18px; border-radius:var(--r); border:var(--bw) solid var(--line); background:var(--surface); cursor:pointer; min-height:120px; }
.pick:hover{ border-color:var(--accent); }
.pick h3{ font-size:1.12rem; }
.pick p{ color:var(--muted); font-size:.95rem; }
.pick .ico{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent); }
.pick.v .ico{ background:var(--vest-soft); color:var(--vest); } .pick.e .ico{ background:var(--esc-soft); color:var(--esc); } .pick.u .ico{ background:var(--uti-soft); color:var(--uti); }
.pick[disabled]{ opacity:.6; cursor:not-allowed; }
.scope{ display:flex; flex-wrap:wrap; gap:8px; }
.scope button{ min-height:44px; padding:6px 14px; border-radius:999px; border:var(--bw) solid var(--line); background:var(--surface); font-weight:700; cursor:pointer; }
.scope button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

/* ---------- fichas ---------- */
.essentials{ background:var(--surface); border:var(--bw) solid var(--line); border-radius:var(--r); padding:20px 22px; }
.essentials ul{ margin:10px 0 0; padding-left:1.2em; display:flex; flex-direction:column; gap:8px; max-width:70ch; }
.deck{ display:flex; flex-direction:column; gap:14px; }
.deck-top{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; color:var(--muted); font-weight:700; }
.fcard{ width:100%; min-height:260px; border-radius:22px; border:var(--bw) solid var(--line); background:var(--surface); padding:28px; display:flex; flex-direction:column; justify-content:center; gap:14px; text-align:left; cursor:pointer; position:relative; transition:transform .25s ease; }
.fcard:hover{ border-color:var(--accent); }
.fcard .fc-label{ font-size:.78rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); }
.fcard .fc-front{ font-family:var(--font-display); font-weight:800; font-size:clamp(1.4rem, 3.6vw, 2rem); }
.fcard.is-back{ background:var(--accent-soft); border-color:var(--accent); }
.fcard.is-back .fc-front{ font-size:1rem; color:var(--muted); font-family:var(--font-body); font-weight:700; }
.fcard .fc-back{ font-size:1.2rem; max-width:60ch; }
.fcard .fc-hint{ position:absolute; right:18px; bottom:14px; font-size:.82rem; color:var(--muted); display:flex; gap:6px; align-items:center; }
.fcard.pop{ animation:pop .28s ease; }
@keyframes pop{ 0%{ transform:scale(.97) rotateX(8deg) } 100%{ transform:none } }
.deck-actions{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
.deck-actions.two{ grid-template-columns:repeat(2, minmax(0,1fr)); }
@media (max-width:520px){ .deck-actions{ grid-template-columns:1fr 1fr; } .deck-actions .flip{ grid-column:1 / -1; order:-1; } }
.dots{ display:flex; flex-wrap:wrap; gap:6px; }
.dots i{ width:12px; height:12px; border-radius:50%; background:var(--surface-2); border:var(--bw) solid var(--line); }
.dots i.k{ background:var(--ok); border-color:var(--ok); }
.dots i.cur{ outline:2px solid var(--ink); outline-offset:2px; }

/* ---------- quiz ---------- */
.qhead{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.qhead .bar{ flex:1 1 200px; }
.qcard{ background:var(--surface); border:var(--bw) solid var(--line); border-radius:22px; padding:24px; display:flex; flex-direction:column; gap:18px; }
.qcard h2{ font-size:clamp(1.3rem, 3.2vw, 1.7rem); font-weight:700; font-family:var(--font-body); line-height:1.35; }
.opts{ display:flex; flex-direction:column; gap:10px; list-style:none; margin:0; padding:0; }
.opt{ width:100%; display:flex; align-items:flex-start; gap:14px; text-align:left; padding:14px 16px; min-height:56px; border-radius:14px; border:var(--bw) solid var(--line); background:var(--surface); cursor:pointer; font-size:1.02rem; line-height:1.45; }
.opt:hover:not([disabled]){ border-color:var(--accent); background:var(--accent-soft); }
.opt .key{ flex:none; width:32px; height:32px; border-radius:9px; display:grid; place-items:center; font-weight:700; background:var(--surface-2); border:var(--bw) solid var(--line); }
.opt .txt{ flex:1; min-width:0; padding-top:3px; }
.opt .mark{ flex:none; display:flex; align-items:center; gap:4px; font-size:.82rem; font-weight:700; padding-top:5px; }
.opt[disabled]{ cursor:default; }
.opt.is-correct{ border-color:var(--ok); background:var(--ok-soft); }
.opt.is-correct .key{ background:var(--ok); color:var(--surface); border-color:var(--ok); }
.opt.is-correct .mark{ color:var(--ok); }
.opt.is-wrong{ border-color:var(--bad); background:var(--bad-soft); }
.opt.is-wrong .key{ background:var(--bad); color:var(--surface); border-color:var(--bad); }
.opt.is-wrong .mark{ color:var(--bad); }
.opt.is-dim{ opacity:.8; }
.opt.is-picked{ border-color:var(--accent); background:var(--accent-soft); }
.opt.is-picked .key{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.feedback{ border-radius:14px; padding:16px 18px; border:var(--bw) solid; display:flex; flex-direction:column; gap:6px; }
.feedback.ok{ background:var(--ok-soft); border-color:var(--ok); }
.feedback.bad{ background:var(--bad-soft); border-color:var(--bad); }
.feedback b.t{ font-size:1.1rem; display:flex; gap:8px; align-items:center; }
.feedback.ok b.t{ color:var(--ok); } .feedback.bad b.t{ color:var(--bad); }
.src{ font-size:.85rem; color:var(--muted); }
.qnav{ display:flex; flex-wrap:wrap; gap:6px; }
.qnav button{ width:40px; height:40px; border-radius:10px; border:var(--bw) solid var(--line); background:var(--surface); font-weight:700; cursor:pointer; }
.qnav button.done{ background:var(--accent-soft); border-color:var(--accent); }
.qnav button[aria-current="true"]{ background:var(--ink); color:var(--bg); border-color:var(--ink); }

/* ---------- resultados ---------- */
.score{ display:flex; align-items:center; gap:22px; flex-wrap:wrap; }
.ring{ --p:0; width:132px; height:132px; border-radius:50%; flex:none; display:grid; place-items:center; background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-2) 0); }
.ring > div{ width:104px; height:104px; border-radius:50%; background:var(--surface); display:grid; place-items:center; text-align:center; font-family:var(--font-display); font-weight:800; font-size:1.6rem; line-height:1; }
.ring small{ display:block; font-family:var(--font-body); font-size:.75rem; color:var(--muted); font-weight:700; margin-top:4px; }
.missed{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.missed li{ border:var(--bw) solid var(--line); border-radius:14px; padding:14px 16px; background:var(--surface); display:flex; flex-direction:column; gap:4px; }
.missed .yours{ color:var(--bad); } .missed .right{ color:var(--ok); font-weight:700; }

/* ---------- relaciona ---------- */
.match{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.5fr); gap:16px; align-items:start; }
@media (max-width:640px){ .match{ grid-template-columns:1fr; } }
.mcol{ display:flex; flex-direction:column; gap:10px; }
.mitem{ text-align:left; padding:12px 14px; min-height:52px; border-radius:12px; border:var(--bw) solid var(--line); background:var(--surface); cursor:pointer; display:flex; gap:10px; align-items:center; line-height:1.4; }
.mitem.term{ font-weight:700; }
.mitem:hover:not([disabled]){ border-color:var(--accent); }
.mitem[aria-pressed="true"]{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 2px var(--accent) inset; }
.mitem.done{ border-color:var(--ok); background:var(--ok-soft); cursor:default; }
.mitem .pairno{ margin-left:auto; flex:none; font-size:.8rem; font-weight:700; color:var(--ok); display:flex; gap:4px; align-items:center; }
.mitem.shake{ animation:shake .35s ease; border-color:var(--bad); }
@keyframes shake{ 25%{ transform:translateX(-5px) } 75%{ transform:translateX(5px) } }

/* ---------- ordena ---------- */
.olist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
.oitem{ display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:14px; border:var(--bw) solid var(--line); background:var(--surface); }
.oitem .n{ flex:none; width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-weight:700; background:var(--surface-2); }
.oitem .txt{ flex:1; min-width:0; font-weight:700; }
.oitem .moves{ display:flex; gap:6px; flex:none; }
.oitem .moves button{ width:44px; height:44px; border-radius:10px; border:var(--bw) solid var(--line); background:var(--surface); cursor:pointer; display:grid; place-items:center; }
.oitem .moves button:hover:not([disabled]){ border-color:var(--accent); }
.oitem .moves button[disabled]{ opacity:.35; cursor:not-allowed; }
.oitem.good{ border-color:var(--ok); background:var(--ok-soft); } .oitem.good .n{ background:var(--ok); color:var(--surface); }
.oitem.badpos{ border-color:var(--bad); background:var(--bad-soft); } .oitem.badpos .n{ background:var(--bad); color:var(--surface); }
.oitem .st{ font-size:.82rem; font-weight:700; display:flex; gap:4px; align-items:center; }
.oitem.good .st{ color:var(--ok); } .oitem.badpos .st{ color:var(--bad); }

/* ---------- progreso ---------- */
.tiles{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
@media (max-width:760px){ .tiles{ grid-template-columns:repeat(2, minmax(0,1fr)); } }
.tile{ background:var(--surface); border:var(--bw) solid var(--line); border-radius:var(--r); padding:16px; }
.tile .k{ font-size:.78rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); }
.tile .v{ font-family:var(--font-display); font-weight:800; font-size:1.7rem; margin-top:4px; }
.tile .s{ font-size:.88rem; color:var(--muted); }
.mastery{ display:flex; flex-direction:column; gap:14px; }
.mrow{ display:grid; grid-template-columns:minmax(0, 1.4fr) minmax(0, 2fr) 56px; gap:12px; align-items:center; }
@media (max-width:560px){ .mrow{ grid-template-columns:minmax(0,1fr) 56px; } .mrow .bar{ grid-column:1 / -1; grid-row:2; } }
.mrow .pct{ text-align:right; font-weight:700; }
.badges{ display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap:12px; }
.badge{ display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:14px; border:var(--bw) dashed var(--line); background:transparent; }
.badge .medal{ flex:none; width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--surface-2); color:var(--muted); }
.badge.on{ border-style:solid; background:var(--surface); border-color:var(--bulb); }
.badge.on .medal{ background:var(--bulb); color:#2A1440; }
.badge b{ display:block; }
.badge p{ font-size:.88rem; color:var(--muted); }
.badge .state{ font-size:.75rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.cal{ display:flex; gap:6px; flex-wrap:wrap; }
.cal div{ display:flex; flex-direction:column; align-items:center; gap:4px; font-size:.72rem; color:var(--muted); font-weight:700; }
.cal i{ width:28px; height:28px; border-radius:8px; background:var(--surface-2); border:var(--bw) solid var(--line); display:grid; place-items:center; font-style:normal; font-size:.72rem; color:var(--ink); }
.cal i.l1{ background:var(--accent-soft); border-color:var(--accent); }
.cal i.l2{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
textarea{ width:100%; min-height:90px; padding:12px; border-radius:12px; border:var(--bw) solid var(--line); background:var(--bg); font-size:.9rem; word-break:break-all; }
input[type="text"]{ min-height:48px; padding:10px 14px; border-radius:12px; border:var(--bw) solid var(--line); background:var(--surface); flex:1 1 220px; min-width:0; }
.confirm{ border:var(--bw) solid var(--bad); background:var(--bad-soft); border-radius:14px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }

/* ---------- paneles flotantes ---------- */
.popover{ position:absolute; right:max(16px, env(safe-area-inset-right,0px)); top:calc(100% + 8px); width:min(360px, calc(100vw - 32px)); background:var(--surface); border:var(--bw) solid var(--line); border-radius:var(--r); padding:18px; box-shadow:0 18px 40px rgba(20,10,40,.22); display:flex; flex-direction:column; gap:16px; z-index:40; }
.popover h2{ font-size:1.1rem; }
.setting{ display:flex; flex-direction:column; gap:8px; }
.setting .lbl{ font-weight:700; }
.seg{ display:flex; border:var(--bw) solid var(--line); border-radius:12px; overflow:hidden; }
.seg button{ flex:1; min-height:44px; border:0; background:var(--surface); cursor:pointer; font-weight:700; border-right:var(--bw) solid var(--line); }
.seg button:last-child{ border-right:0; }
.seg button[aria-pressed="true"]{ background:var(--ink); color:var(--bg); }
.switch{ display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px; width:100%; border:0; background:transparent; cursor:pointer; text-align:left; padding:0; }
.switch .tr{ flex:none; width:52px; height:30px; border-radius:999px; background:var(--surface-2); border:var(--bw) solid var(--line); position:relative; }
.switch .tr::after{ content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--muted); transition:left .2s; }
.switch[aria-checked="true"] .tr{ background:var(--accent); border-color:var(--accent); }
.switch[aria-checked="true"] .tr::after{ left:25px; background:var(--accent-ink); }
.switch small{ display:block; color:var(--muted); font-size:.85rem; }
.overlay{ position:fixed; inset:0; z-index:50; background:rgba(15,8,25,.55); display:grid; place-items:center; padding:16px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); }
.modal{ background:var(--surface); border-radius:22px; border:var(--bw) solid var(--line); width:min(680px, 100%); max-height:min(86vh, 900px); overflow:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
.modal h2{ font-size:1.5rem; }
.modal h3{ font-size:1.1rem; margin-top:4px; }
.modal ul{ margin:0; padding-left:1.2em; display:flex; flex-direction:column; gap:6px; }
kbd{ font-family:inherit; font-weight:700; font-size:.85em; padding:2px 7px; border-radius:6px; border:var(--bw) solid var(--line); background:var(--surface-2); }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:60; background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:14px; font-weight:700; display:flex; gap:10px; align-items:center; max-width:calc(100vw - 32px); box-shadow:0 12px 30px rgba(0,0,0,.25); }
@media (max-width:720px){ .toast{ bottom:calc(90px + env(safe-area-inset-bottom,0px)); } }

const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pad(n){ return String(n).padStart(2,"0"); }
function today(d=new Date()){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function dayDiff(a,b){ return Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/864e5); }
function streakNow(){ if(!S.streak.last) return 0; const d = dayDiff(S.streak.last, today()); return d<=1 ? S.streak.n : 0; }
function levelOf(xp){ let i=0; LEVELS.forEach((l,k)=>{ if(xp>=l.x) i=k; }); return i; }
function topicMastery(tid){ const qs = TMAP[tid].qs; let ok=0; qs.forEach((_,i)=>{ const r=S.q[tid+"-"+i]; if(r && r.last) ok++; }); return { ok, n:qs.length, p: Math.round(ok/qs.length*100) }; }
function unitMastery(u){ let ok=0,n=0; TOPICS.filter(t=>t.u===u).forEach(t=>{ const m=topicMastery(t.id); ok+=m.ok; n+=m.n; }); return { ok, n, p: n? Math.round(ok/n*100):0 }; }
function wrongIds(){ return Object.keys(S.q).filter(id=>S.q[id].last===false && QMAP[id]); }
function cardsKnown(tid){ return TMAP[tid].cards.filter((_,i)=>S.cards[tid+"-c"+i]==="k").length; }
function totalKnownCards(){ return Object.values(S.cards).filter(v=>v==="k").length; }

/* actividad diaria y racha */
function sessionStart(){
  const t = today();
  S.days[t] = (S.days[t]||0)+1;
  if(S.streak.last !== t){
    S.streak.n = (S.streak.last && dayDiff(S.streak.last,t)===1) ? S.streak.n+1 : 1;
    S.streak.last = t; S.streak.best = Math.max(S.streak.best||0, S.streak.n);
  }
}
function gain(n){
  const before = levelOf(S.xp); S.xp += n; if(run) run.xp = (run.xp||0)+n;
  const after = levelOf(S.xp);
  if(after>before) toast("¡Subiste de nivel! Ahora eres "+LEVELS[after].n, "star");
}
function recordAnswer(qid, ok){
  const r = S.q[qid] || { ok:0, ko:0 };
  if(ok){ gain(r.ok ? 5 : 10); r.ok++; } else { r.ko++; }
  r.last = ok; r.t = Date.now(); S.q[qid] = r;
}
function checkBadges(){
  const have = S.badges, got = [];
  const give = id => { if(!have[id]){ have[id] = today(); got.push(id); } };
  if(S.stats.rounds>=1) give("primer");
  if(S.stats.perfect) give("perfecta");
  if((S.streak.best||0)>=3) give("racha3");
  if((S.streak.best||0)>=7) give("racha7");
  if(totalKnownCards()>=30) give("fichas");
  if(S.stats.matches>=3) give("relaciona");
  if(S.stats.orders>=3) give("ordena");
  ["v","e","u"].forEach(u=>{ if(unitMastery(u).p>=80) give("u"+u); });
  if(S.sims.length) give("sim");
  if(S.sims.some(s=>s.s/s.n>=.8)) give("sim8");
  if(got.length){ const b = BADGES.find(x=>x.id===got[0]); setTimeout(()=>toast("Insignia desbloqueada: "+b.n, "medal"), 500); }
}

function pickQuick(){
  const wrong = shuffle(wrongIds()), unseen = shuffle(ALLQ.filter(q=>!S.q[q.id]).map(q=>q.id)), rest = shuffle(ALLQ.map(q=>q.id));
  const out = []; [wrong.slice(0,2), unseen, rest].forEach(arr=>arr.forEach(id=>{ if(out.length<5 && !out.includes(id)) out.push(id); }));
  return out;
}
function startQuiz(ids, label){
  if(!ids.length) return;
  sessionStart();
  run = { type:"quiz", label, ids, i:0, picked:null, opts:shuffle(QMAP[ids[0]].o), res:[], xp:0 };
  save(); focusAfter = "h2"; render();
}
function pickForScope(s, n){
  const pool = ALLQ.filter(q=>inScope(q,s));
  const unseen = shuffle(pool.filter(q=>!S.q[q.id] || S.q[q.id].last===false)).map(q=>q.id);
  const seen = shuffle(pool.filter(q=>S.q[q.id] && S.q[q.id].last)).map(q=>q.id);
  return unseen.concat(seen).slice(0,n);
}

  h += '</div><div class="mcol" role="group" aria-label="Definiciones"><p class="eyebrow">Definiciones</p>';

function tryMatch(){
  if(run.selL===null || run.selR===null) return;
  const s = run.set, L = run.selL, R = run.selR;
  if(L===R){
    run.done.push(L); run.msg = "¡Bien! «"+s.pairs[L][0]+"» va con su definición."; run.bad=null;
    announce(run.msg);
    if(run.done.length===s.pairs.length){ gain(run.errors===0?25:15); S.stats.matches++; S.last = s.t; checkBadges(); save(); focusAfter="#btnRes"; announce("Completaste todos los pares."); }
  } else {
    run.errors++; run.bad=[L,R]; run.msg = "Esa definición no corresponde a «"+s.pairs[L][0]+"». Intenta con otra."; announce(run.msg);
  }
  run.selL = null; run.selR = null; render();
}

function startSim(){
  const ids = [];
  const per = { v:7, e:7, u:6 };
  ["v","e","u"].forEach(u=>{ shuffle(ALLQ.filter(q=>q.u===u)).slice(0,per[u]).forEach(q=>ids.push(q.id)); });
  sessionStart();
  run = { type:"sim", ids:shuffle(ids), opts:{}, ans:{}, i:0, done:false, t0:Date.now(), xp:0 };
  run.ids.forEach(id=>{ run.opts[id] = shuffle(QMAP[id].o); });
  save(); focusAfter="h2"; render();
  if(ui.simTimer) tick();
}

function finishSim(){
  run.done = true; ui.confirmSubmit = false; clearTimeout(tickT);
  const per = { v:[0,0], e:[0,0], u:[0,0] }; let ok = 0;
  run.ids.forEach(id=>{ const q=QMAP[id], good = run.ans[id]===q.ans; per[q.u][1]++; if(good){ ok++; per[q.u][0]++; } if(run.ans[id]) recordAnswer(id, good); else { const r=S.q[id]||{ok:0,ko:0}; r.ko++; r.last=false; r.t=Date.now(); S.q[id]=r; } });
  gain(50);
  run.score = ok; run.per = per; run.secs = Math.floor((Date.now()-run.t0)/1000);
  S.sims.push({ d:today(), s:ok, n:run.ids.length, per });
  checkBadges(); save(); focusAfter="h1"; render();
}

const ACT = {
  quick(){ startQuiz(pickQuick(), "Reto rápido"); },
  skipName(){ S.nameSkip = true; save(); render(); },
  study(d){ ui.studyTopic = d.t; ui.cardIdx = 0; ui.flipped = false; S.last = d.t; save(); if(view!=="estudiar"){ go("estudiar"); } else { focusAfter="h1"; render(); } },
  backTopics(){ ui.studyTopic = null; focusAfter="h1"; render(); },
  flip(){ ui.flipped = !ui.flipped; ui.anim = true; if(ui.flipped){ const t=TMAP[ui.studyTopic]; announce("Respuesta: "+t.cards[ui.cardIdx][1]); focusAfter="#btnKnow"; } else focusAfter="#fcard"; render(); ui.anim=false; },
  prevCard(){ if(ui.cardIdx>0){ ui.cardIdx--; ui.flipped=false; focusAfter="#fcard"; render(); } },
  nextCard(){ const n=TMAP[ui.studyTopic].cards.length; if(ui.cardIdx<n-1){ ui.cardIdx++; ui.flipped=false; focusAfter="#fcard"; render(); } },
  know(){ markCard("k"); },
  topicQuiz(d){ S.last = d.t; ui.scope = d.t; startQuiz(pickForScope(d.t, 10), TMAP[d.t].n); if(view!=="practicar"){ history.replaceState(null,"","#practicar"); view="practicar"; paintTabs(); } },
  scope(d){ ui.scope = d.s; focusAfter = '[data-act="scope"][data-s="'+d.s+'"]'; render(); },
  startQuiz(){ startQuiz(pickForScope(ui.scope, 10), scopeLabel(ui.scope)); },
  startReview(){ const ids = shuffle(wrongIds()).slice(0,10); if(!ids.length) return; if(view!=="practicar"){ history.replaceState(null,"","#practicar"); view="practicar"; } startQuiz(ids, "Repaso de errores"); },
  startMatch(){ startMatch(); },
  startOrder(){ startOrder(); },
  pick(d){
    if(run.picked!==null) return;
    const k = +d.i, q = QMAP[run.ids[run.i]], ok = run.opts[k]===q.ans;
    run.picked = k; recordAnswer(q.id, ok); run.res.push({ id:q.id, ok, pick:run.opts[k] }); S.last = q.t; save();
    announce(ok ? "¡Correcto! "+q.e : "Incorrecto. La respuesta correcta es: "+q.ans+". "+q.e);
    focusAfter = "#btnNext"; render();
  },
  next(){
    if(run.i < run.ids.length-1){ run.i++; run.picked=null; run.opts=shuffle(QMAP[run.ids[run.i]].o); focusAfter="h2"; render(); }
    else {
      S.stats.rounds++; if(run.res.length>=5 && run.res.every(r=>r.ok)) S.stats.perfect = (S.stats.perfect||0)+1;
      checkBadges(); save();
      run.finished = true; focusAfter = "#btnRes"; render();
    }
  },
  retryMissed(){ const ids = run.res.filter(r=>!r.ok).map(r=>r.id); startQuiz(shuffle(ids), "Repaso de errores"); },
  again(d,b){ if(run && run.type==="quiz"){ const lbl = run.label; startQuiz(lbl==="Reto rápido" ? pickQuick() : lbl==="Repaso de errores" ? shuffle(wrongIds()).slice(0,10) : pickForScope(ui.scope,10), lbl); } else markCard("a"); },
  exitRun(){ run = null; focusAfter="h1"; render(); },
  mL(d){ run.selL = (run.selL===+d.i) ? null : +d.i; run.bad=null; run.msg=""; if(run.selR!==null) tryMatch(); else { focusAfter='[data-act="mL"][data-i="'+d.i+'"]'; render(); } },
  mR(d){ run.selR = (run.selR===+d.i) ? null : +d.i; run.bad=null; run.msg=""; if(run.selL!==null) tryMatch(); else { focusAfter='[data-act="mR"][data-i="'+d.i+'"]'; render(); } },
  up(d){ moveStep(+d.i, -1); },
  down(d){ moveStep(+d.i, 1); },
  check(){
    run.checked = true; run.tries++;
    const all = run.cur.every((v,i)=>v===i);
    if(all){ run.solved = true; gain(run.tries===1?30:15); if(run.tries===1) S.stats.orders++; S.last = run.set.t; checkBadges(); save(); focusAfter="#btnRes"; announce("¡Orden perfecto!"); }
    else { const g = run.cur.filter((v,i)=>v===i).length; announce(g+" de "+run.cur.length+" pasos en su lugar."); focusAfter="#btnCheck"; }
    render();
  },
  solve(){ run.cur = run.set.steps.map((_,i)=>i); run.checked=true; run.solved=true; run.shown=true; focusAfter="#btnRes"; render(); },
  simTimer(){ ui.simTimer = !ui.simTimer; focusAfter='[data-act="simTimer"]'; render(); },
  simStart(){ if(view!=="simulacro"){ history.replaceState(null,"","#simulacro"); view="simulacro"; } startSim(); },
  simPick(d){ const id = run.ids[run.i]; run.ans[id] = run.opts[id][+d.i]; focusAfter = run.i<run.ids.length-1 ? "#simNextBtn" : '[data-act="simSubmit"]'; render(); tick(); },
  simGo(d){ run.i = +d.i; ui.confirmSubmit=false; focusAfter="h2"; render(); tick(); },
  simPrev(){ if(run.i>0){ run.i--; focusAfter="h2"; render(); tick(); } },
  simNext(){ if(run.i<run.ids.length-1){ run.i++; focusAfter="h2"; render(); tick(); } },
  simSubmit(){ ui.confirmSubmit = true; focusAfter="#btnConfirm"; render(); tick(); },
  simCancel(){ ui.confirmSubmit = false; focusAfter="h2"; render(); tick(); },
  simConfirm(){ finishSim(); },
  copyCode(){
    const ta = document.getElementById("codeOut"), txt = ta.value;
    const ok = ()=>toast("Código copiado. Guárdalo en un lugar seguro.","check");
    const fallback = ()=>{ ta.focus(); ta.select(); toast("Selecciona y copia el código manualmente.","alert"); };
    try{ navigator.clipboard.writeText(txt).then(ok, fallback); }catch(e){ fallback(); }
  },
  importCode(){
    const raw = (document.getElementById("codeIn").value||"").trim();
    if(!raw){ ui.importMsg = "Primero pega tu código en el cuadro."; render(); return; }
    try{
      const d = JSON.parse(decodeURIComponent(escape(atob(raw))));
      if(!d || typeof d!=="object" || !d.q) throw new Error("x");
      const base = defState();
      S = Object.assign(base, d, { settings:Object.assign(base.settings, d.settings||{}), stats:Object.assign(base.stats, d.stats||{}), streak:Object.assign(base.streak, d.streak||{}) });
      save(); applySettings(); ui.importMsg = "¡Listo! Recuperamos tu avance."; toast("Avance recuperado","check");
    }catch(e){ ui.importMsg = "Ese código no es válido. Revisa que lo hayas copiado completo."; }
    render();
  },
  reset(){ ui.confirmReset = true; focusAfter="#btnResetYes"; render(); },
  resetNo(){ ui.confirmReset = false; render(); },
  resetYes(){ const keep = S.settings; S = defState(); S.settings = keep; ui.confirmReset=false; ui.studyTopic=null; save(); toast("Tu avance se borró. ¡A empezar de nuevo!","redo"); focusAfter="h1"; render(); },
  fs(d){ S.settings.fs = +d.v; applySettings(); save(); paintReadPanel(); focusIn('[data-act="fs"][data-v="'+d.v+'"]'); },
  theme(d){ S.settings.theme = d.v; applySettings(); save(); paintReadPanel(); focusIn('[data-act="theme"][data-v="'+d.v+'"]'); },
  hc(){ S.settings.hc = !S.settings.hc; applySettings(); save(); paintReadPanel(); focusIn('[data-act="hc"]'); },
  sp(){ S.settings.sp = !S.settings.sp; applySettings(); save(); paintReadPanel(); focusIn('[data-act="sp"]'); },
  rm(){ S.settings.rm = !S.settings.rm; applySettings(); save(); paintReadPanel(); focusIn('[data-act="rm"]'); },
  closeRead(){ openRead(false); },
  closeHelp(){ closeHelp(); }
};
function focusIn(sel){ const el=document.querySelector("#readPanel "+sel); if(el) el.focus(); }
function markCard(v){
  const t = TMAP[ui.studyTopic]; S.cards[t.id+"-c"+ui.cardIdx] = v;
  if(v==="k") gain(2);
  if(!S.days[today()]) sessionStart();
  S.last = t.id; checkBadges(); save();
  const n = t.cards.length;
  if(ui.cardIdx < n-1){ ui.cardIdx++; ui.flipped=false; focusAfter="#fcard"; render(); }
  else { ui.flipped=false; render(); const k=cardsKnown(t.id); toast(k===n ? "¡Dominas todas las fichas de este tema!" : "Terminaste el mazo: "+k+" de "+n+" dominadas.", k===n?"star":"cards"); ui.cardIdx=0; focusAfter="#fcard"; render(); }
}
function moveStep(pos, dir){
  const to = pos+dir; if(to<0 || to>=run.cur.length) return;
  [run.cur[pos], run.cur[to]] = [run.cur[to], run.cur[pos]];
  run.checked = false;
  focusAfter = '[data-act="'+(dir<0?"up":"down")+'"][data-i="'+to+'"]';
  render();
  const el = document.querySelector(focusAfter||"x"); if(!el || el.disabled){ const alt=document.querySelector('[data-act="'+(dir<0?"down":"up")+'"][data-i="'+to+'"]'); if(alt) alt.focus(); }
  announce("Paso movido a la posición "+(to+1)+".");
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]");
  if(b && !b.disabled){ const fn = ACT[b.dataset.act]; if(fn){ e.preventDefault(); fn(b.dataset, b); } return; }
  const rp = document.getElementById("readPanel");
  if(!rp.hidden && !rp.contains(e.target) && !e.target.closest("#btnRead")) openRead(false);
  if(e.target.id==="overlay") closeHelp();
});
document.getElementById("btnRead").addEventListener("click", ()=>openRead(document.getElementById("readPanel").hidden));
document.getElementById("btnHelp").addEventListener("click", openHelp);
document.addEventListener("submit", e=>{
  if(e.target.id==="nameForm"){ e.preventDefault(); const v=(document.getElementById("nameIn").value||"").trim(); if(v){ S.name=v.slice(0,30); save(); toast("¡Mucho gusto, "+S.name+"!","star"); render(); } else { document.getElementById("nameIn").focus(); } }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(!document.getElementById("overlay").hidden){ closeHelp(); return; } if(!document.getElementById("readPanel").hidden){ openRead(false); return; } }
  if(e.target.matches("input, textarea") || e.altKey || e.ctrlKey || e.metaKey) return;
  if(!document.getElementById("overlay").hidden) return;
  const k = e.key.toLowerCase();
  if(run && (run.type==="quiz" && !run.finished || run.type==="sim" && !run.done)){
    const map = { "1":0,"2":1,"3":2,"4":3,"a":0,"b":1,"c":2,"d":3 };
    if(k in map){ const btn = document.querySelector('[data-act="'+(run.type==="quiz"?"pick":"simPick")+'"][data-i="'+map[k]+'"]'); if(btn && !btn.disabled){ e.preventDefault(); btn.click(); } }
    return;
  }
  if(!run && view==="estudiar" && ui.studyTopic){
    if(k==="v"){ e.preventDefault(); ACT.flip(); }
    else if(e.key==="ArrowRight" && !ui.flipped){ e.preventDefault(); ACT.nextCard(); }
    else if(e.key==="ArrowLeft" && !ui.flipped){ e.preventDefault(); ACT.prevCard(); }
  }
});
window.addEventListener("hashchange", route);

/* arranque */
applySettings();
paintSave();
route();
</script>
